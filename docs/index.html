<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ICLR 2027 Scores</title>
<meta name="description" content="Score distributions and paper list for ICLR 2027 submissions during the discussion period.">
<style>
:root {
  color-scheme: light;
  --surface: #fcfcfb; --card: #ffffff; --line: #e4e3df; --grid: #eeede9;
  --text: #0b0b0b; --text-2: #52514e; --text-3: #706f6a;
  --series: #2a78d6; --link: #1f62b5; --row: #f5f5f2;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --surface: #1a1a19; --card: #222220; --line: #3a3936; --grid: #2e2d2b;
    --text: #f0efec; --text-2: #c3c2b7; --text-3: #a3a297;
    --series: #3987e5; --link: #7db3f0; --row: #2a2a27;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface: #1a1a19; --card: #222220; --line: #3a3936; --grid: #2e2d2b;
  --text: #f0efec; --text-2: #c3c2b7; --text-3: #a3a297;
  --series: #3987e5; --link: #7db3f0; --row: #2a2a27;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--surface); color: var(--text);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
main { max-width: 1080px; margin: 0 auto; padding: 32px 16px 56px; }
h1 { font-size: 28px; line-height: 1.2; margin: 0 0 6px; letter-spacing: -0.01em; }
h2 { font-size: 18px; margin: 40px 0 12px; }
h3 { font-size: 14px; margin: 0 0 2px; font-weight: 600; }
.sub { color: var(--text-2); margin: 0; }
.note { color: var(--text-3); font-size: 13px; margin: 2px 0 8px; }
a { color: var(--link); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-top: 24px; }
.tile, .chart { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; }
.tile b { display: block; font-size: 24px; line-height: 1.2; font-variant-numeric: tabular-nums; font-weight: 600; }
.tile span { color: var(--text-2); font-size: 13px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-top: 12px; }
svg { display: block; width: 100%; height: auto; overflow: visible; }
svg text { fill: var(--text-3); font-size: 11px; font-variant-numeric: tabular-nums; }
.hit { fill: transparent; }
svg text.lab { fill: var(--text-2); font-weight: 600; }
.guide { stroke: var(--text-3); stroke-width: 1; stroke-dasharray: 3 3; }
.bar { fill: var(--series); pointer-events: none; }
.barhit { fill: transparent; }
.barhit:hover { fill: var(--row); }
svg text.lab { pointer-events: none; }
.gridline { stroke: var(--grid); stroke-width: 1; }
.base { stroke: var(--line); stroke-width: 1; }
.trend { fill: none; stroke: var(--series); stroke-width: 2; }
.dot { fill: var(--series); stroke: var(--card); stroke-width: 2; }
#tip { position: fixed; pointer-events: none; display: none; z-index: 5; background: var(--card); color: var(--text);
  border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; font-size: 13px;
  box-shadow: 0 2px 8px rgba(0,0,0,.15); font-variant-numeric: tabular-nums; }
.controls { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-bottom: 10px; }
input[type=search] { flex: 1 1 240px; min-width: 0; padding: 8px 10px; font: inherit; color: var(--text);
  background: var(--card); border: 1px solid var(--line); border-radius: 6px; }
button { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line);
  border-radius: 6px; padding: 6px 10px; cursor: pointer; }
button:disabled { color: var(--text-3); cursor: default; }
.tablewrap { overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--grid); vertical-align: top; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover { background: var(--row); }
th { font-size: 13px; color: var(--text-2); font-weight: 600; white-space: nowrap; }
th button { border: 0; background: none; padding: 0; color: inherit; font-weight: 600; font-size: 13px; }
td.num, th.num { text-align: right; white-space: nowrap; }
td.title { min-width: 280px; }
.pager { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 10px; color: var(--text-2); font-size: 13px; }
.pager div { display: flex; gap: 6px; }
footer { margin-top: 40px; color: var(--text-3); font-size: 13px; }
details { margin-top: 10px; font-size: 13px; color: var(--text-2); }
details table { margin-top: 6px; max-width: 420px; }
details td, details th { padding: 3px 8px; }
.sectionhead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 16px; margin: 40px 0 8px; }
.sectionhead h2 { margin: 0; }
.seg { display: inline-flex; }
.seg button { border-radius: 0; margin-left: -1px; }
.seg button:first-child { border-radius: 6px 0 0 6px; margin-left: 0; }
.seg button:last-child { border-radius: 0 6px 6px 0; }
.seg button[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: var(--surface); }
.explain { color: var(--text-2); margin: 0 0 12px; max-width: 76ch; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>ICLR 2027 Scores</h1>
  <p class="sub" id="sub">Loading…</p>
  <div class="tiles" id="tiles"></div>

  <div class="sectionhead">
    <h2>Score distributions</h2>
    <div class="seg" role="group" aria-label="Chart type">
      <button type="button" id="viewCdf" aria-pressed="true">CDF curves</button>
      <button type="button" id="viewHist" aria-pressed="false">Histograms</button>
    </div>
  </div>
  <p class="explain" id="explain"></p>
  <div class="grid2">
    <div class="chart"><h3>Mean rating per paper</h3><p class="note" id="meanNote"></p><div id="meanChart"></div></div>
    <div class="chart"><h3>Individual ratings</h3><p class="note" id="ratingNote"></p><div id="ratingChart"></div></div>
  </div>
  <div class="grid3" id="otherCharts"></div>
  <details><summary>Show these distributions as tables</summary><div id="dataTables"></div></details>

  <section id="trendSection" hidden>
    <h2>Change during discussion</h2>
    <div class="chart"><h3>Average rating by snapshot</h3><p class="note">Mean of all individual ratings at each snapshot.</p><div id="trendChart"></div></div>
  </section>

  <h2>Papers</h2>
  <div class="controls">
    <input type="search" id="search" placeholder="Search titles" aria-label="Search paper titles">
  </div>
  <div class="tablewrap"><table>
    <thead><tr id="head"></tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
  <div class="pager"><span id="count">Loading papers…</span><div>
    <button id="prev">Previous</button><button id="next">Next</button>
  </div></div>

  <footer id="foot"></footer>
</main>
<div id="tip" role="status"></div>
<script>
"use strict";
const PAGE = 50, $ = id => document.getElementById(id), SVG = "http://www.w3.org/2000/svg";
const fmt = n => n == null ? "–" : n.toLocaleString("en-US");
const fix = (n, d = 2) => n == null ? "–" : n.toFixed(d);
const cap = s => s[0].toUpperCase() + s.slice(1);
const pct = p => (p * 100).toFixed(1) + "%";
const when = iso => new Date(iso).toLocaleString("en-US", { dateStyle: "medium", timeStyle: "short", timeZone: "UTC" }) + " UTC";

function el(tag, attrs = {}, parent) {
  const node = document.createElementNS(SVG, tag);
  for (const k in attrs) node.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(node);
  return node;
}
function tip(node, text) {
  const tipEl = $("tip");
  node.addEventListener("mousemove", e => {
    tipEl.textContent = text; tipEl.style.display = "block";
    const x = Math.min(e.clientX + 12, innerWidth - tipEl.offsetWidth - 8);
    tipEl.style.left = x + "px"; tipEl.style.top = (e.clientY - 34) + "px";
  });
  node.addEventListener("mouseleave", () => { tipEl.style.display = "none"; });
}
function niceMax(v) {
  const p = 10 ** Math.floor(Math.log10(Math.max(v, 1)));
  for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= v) return m * p;
  return v;
}
// Running totals for [[value, count], ...] sorted by value.
function cumulative(data) {
  const total = data.reduce((sum, d) => sum + d[1], 0);
  let running = 0;
  return data.map(([v, c]) => { running += c; return { v, c, n: running, p: running / total }; });
}
// Empirical CDF drawn as a step line. data is [[value, count], ...] sorted by value.
function cdfChart(host, data, { w = 480, h = 240, name, unit, describe, xStep }) {
  const m = { t: 20, r: 12, b: 24, l: 42 }, iw = w - m.l - m.r, ih = h - m.t - m.b;
  const pts = cumulative(data);
  const labelled = pts.length <= 6;
  const lo = pts[0].v, hi = pts[pts.length - 1].v, pad = Math.max((hi - lo) * (labelled ? .14 : .06), .1);
  const X = v => m.l + iw * (v - (lo - pad)) / (hi - lo + 2 * pad), Y = p => m.t + ih * (1 - p);
  const invX = x => lo - pad + (x - m.l) / iw * (hi - lo + 2 * pad);
  const svg = el("svg", { viewBox: `0 0 ${w} ${h}`, role: "img", "aria-label": describe });
  for (const q of [0, .25, .5, .75, 1]) {
    el("line", { x1: m.l, x2: w - m.r, y1: Y(q), y2: Y(q), class: q ? "gridline" : "base" }, svg);
    el("text", { x: m.l - 6, y: Y(q) + 4, "text-anchor": "end" }, svg).textContent = `${q * 100}%`;
  }
  for (let v = Math.ceil(lo / xStep) * xStep; v <= hi + 1e-9; v += xStep)
    el("text", { x: X(v), y: h - 6, "text-anchor": "middle" }, svg).textContent = +v.toFixed(2);
  let d = `M${m.l},${Y(0)}`, prev = 0;
  for (const pt of pts) { d += `H${X(pt.v)}V${Y(pt.p)}`; prev = pt.p; }
  el("path", { class: "trend", d: d + `H${w - m.r}` }, svg);
  if (labelled) pts.forEach(pt => {
    el("circle", { class: "dot", cx: X(pt.v), cy: Y(pt.p), r: 4 }, svg);
    el("text", { class: "lab", x: X(pt.v), y: Y(pt.p) - 8, "text-anchor": "middle" }, svg).textContent = pct(pt.p);
  });
  const guide = el("line", { class: "guide", y1: m.t, y2: m.t + ih, visibility: "hidden" }, svg);
  const mark = el("circle", { class: "dot", r: 5, visibility: "hidden" }, svg);
  const hit = el("rect", { class: "hit", x: m.l, y: m.t, width: iw, height: ih }, svg);
  const tipEl = $("tip");
  hit.addEventListener("pointermove", e => {
    const box = svg.getBoundingClientRect(), x = (e.clientX - box.left) * w / box.width, at = invX(x);
    let cur = null;
    for (const pt of pts) { if (pt.v <= at + 1e-9) cur = pt; else break; }
    const px = cur ? X(cur.v) : m.l, py = Y(cur ? cur.p : 0);
    guide.setAttribute("x1", px); guide.setAttribute("x2", px); guide.setAttribute("visibility", "visible");
    mark.setAttribute("cx", px); mark.setAttribute("cy", py); mark.setAttribute("visibility", "visible");
    tipEl.textContent = cur
      ? `${name} ≤ ${+cur.v.toFixed(2)}: ${pct(cur.p)} of ${unit} (${fmt(cur.n)}); above: ${pct(1 - cur.p)}`
      : `${name} below ${+lo.toFixed(2)}: 0% of ${unit}`;
    tipEl.style.display = "block";
    tipEl.style.left = Math.max(8, Math.min(e.clientX + 12, innerWidth - tipEl.offsetWidth - 8)) + "px";
    tipEl.style.top = (e.clientY - 38) + "px";
  });
  hit.addEventListener("pointerleave", () => {
    tipEl.style.display = "none"; guide.setAttribute("visibility", "hidden"); mark.setAttribute("visibility", "hidden");
  });
  host.replaceChildren(svg);
}
// Most papers have three reviews, so their means fall on multiples of 1/3. Bins of that
// width centered on those values avoid the empty gaps that round-number bins would leave.
function thirdsBins(data) {
  const base = Math.floor(data[0][0]), bins = new Map();
  for (const [v, c] of data) {
    const i = Math.round((v - base) * 3);
    bins.set(i, (bins.get(i) || 0) + c);
  }
  const last = Math.max(...bins.keys()), out = [];
  for (let i = 0; i <= last; i++) {
    const v = base + i / 3;
    out.push({ v, c: bins.get(i) || 0, range: `${(v - 1 / 6).toFixed(2)} to ${(v + 1 / 6).toFixed(2)}` });
  }
  return out;
}
function histChart(host, data, { w = 480, h = 240, name, unit, describe, thirds }) {
  const m = { t: 20, r: 12, b: 24, l: 42 }, iw = w - m.l - m.r, ih = h - m.t - m.b;
  const bins = thirds ? thirdsBins(data) : data.map(([v, c]) => ({ v, c }));
  const total = bins.reduce((sum, b) => sum + b.c, 0);
  const peak = Math.max(...bins.map(b => b.c)) / total * 100;
  const step = peak > 40 ? 20 : 10, top = Math.ceil(peak / step) * step;
  const Y = p => m.t + ih * (1 - p * 100 / top);
  const svg = el("svg", { viewBox: `0 0 ${w} ${h}`, role: "img", "aria-label": describe });
  for (let q = 0; q <= top; q += step) {
    el("line", { x1: m.l, x2: w - m.r, y1: Y(q / 100), y2: Y(q / 100), class: q ? "gridline" : "base" }, svg);
    el("text", { x: m.l - 6, y: Y(q / 100) + 4, "text-anchor": "end" }, svg).textContent = `${q}%`;
  }
  const slot = iw / bins.length, bw = Math.min(slot - 2, 72), base = Y(0);
  bins.forEach((b, i) => {
    const p = b.c / total, cx = m.l + slot * (i + .5), x = cx - bw / 2, y = Y(p);
    const hit = el("rect", { class: "barhit", x: m.l + slot * i, y: m.t, width: slot, height: ih }, svg);
    tip(hit, `${name} ${b.range || +b.v.toFixed(2)}: ${pct(p)} of ${unit} (${fmt(b.c)})`);
    const r = Math.min(4, bw / 2, base - y);
    if (b.c) el("path", { class: "bar", d: `M${x},${base}V${y + r}Q${x},${y} ${x + r},${y}H${x + bw - r}Q${x + bw},${y} ${x + bw},${y + r}V${base}Z` }, svg);
    el("text", { class: "lab", x: cx, y: y - 6, "text-anchor": "middle" }, svg).textContent = pct(p);
    el("text", { x: cx, y: h - 6, "text-anchor": "middle" }, svg).textContent = +b.v.toFixed(2);
  });
  host.replaceChildren(svg);
}
function trendChart(host, snaps) {
  const w = 960, h = 220, m = { t: 12, r: 16, b: 24, l: 44 }, iw = w - m.l - m.r, ih = h - m.t - m.b;
  const vals = snaps.map(s => s.mean_rating), pad = Math.max((Math.max(...vals) - Math.min(...vals)) * .25, .05);
  const lo = Math.min(...vals) - pad, hi = Math.max(...vals) + pad;
  const svg = el("svg", { viewBox: `0 0 ${w} ${h}`, role: "img", "aria-label": "Average rating at each snapshot" });
  const X = i => m.l + iw * (snaps.length === 1 ? .5 : i / (snaps.length - 1)), Y = v => m.t + ih * (1 - (v - lo) / (hi - lo));
  for (let i = 0; i <= 4; i++) {
    const v = lo + (hi - lo) * i / 4;
    el("line", { x1: m.l, x2: w - m.r, y1: Y(v), y2: Y(v), class: "gridline" }, svg);
    el("text", { x: m.l - 6, y: Y(v) + 4, "text-anchor": "end" }, svg).textContent = v.toFixed(2);
  }
  el("path", { class: "trend", d: snaps.map((s, i) => `${i ? "L" : "M"}${X(i)},${Y(s.mean_rating)}`).join("") }, svg);
  const every = Math.ceil(snaps.length / 8);
  snaps.forEach((s, i) => {
    el("circle", { class: "dot", cx: X(i), cy: Y(s.mean_rating), r: 5 }, svg);
    const hit = el("circle", { class: "hit", cx: X(i), cy: Y(s.mean_rating), r: 14 }, svg);
    tip(hit, `${when(s.taken_at)}: ${s.mean_rating.toFixed(3)}`);
    if (i % every === 0) el("text", { x: X(i), y: h - 6, "text-anchor": "middle" }, svg).textContent =
      new Date(s.taken_at).toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone: "UTC" });
  });
  host.replaceChildren(svg);
}
function dataTable(name, head, rows) {
  const wrap = document.createElement("div");
  const t = document.createElement("table"), cap_ = t.createCaption(); cap_.textContent = name; cap_.style.textAlign = "left";
  const hr = t.createTHead().insertRow();
  head.forEach(x => { const th = document.createElement("th"); th.textContent = x; hr.appendChild(th); });
  const b = t.createTBody();
  rows.forEach(r => { const tr = b.insertRow(); r.forEach(x => tr.insertCell().textContent = x); });
  wrap.appendChild(t); return wrap;
}

function renderSummary(site, s) {
  $("sub").textContent = `Snapshot of ${when(s.taken_at)}. ${site.snapshots.length} snapshot${site.snapshots.length > 1 ? "s" : ""} so far.`;
  const c = s.top_share_cutoffs;
  const tiles = [
    [fmt(s.papers_with_ratings), "papers with ratings"],
    [fmt(s.reviews), "reviews"],
    [fix(s.mean_of_paper_means), "average paper mean"],
    [fix(s.median_paper_mean), "median paper mean"],
    [fix(c["0.10"]), "top 10% cutoff"],
    [fix(c["0.25"]), "top 25% cutoff"],
  ];
  $("tiles").replaceChildren(...tiles.map(([v, t]) => {
    const d = document.createElement("div"); d.className = "tile";
    const b = document.createElement("b"); b.textContent = v;
    const sp = document.createElement("span"); sp.textContent = t;
    d.append(b, sp); return d;
  }));

  const hist = f => s.histograms[f] || [];
  const others = site.fields.filter(f => f !== "rating");
  const hosts = {};
  $("otherCharts").replaceChildren(...others.map(f => {
    const box = document.createElement("div"); box.className = "chart";
    const h = document.createElement("h3"); h.textContent = cap(f);
    hosts[f] = document.createElement("div");
    box.append(h, hosts[f]);
    return box;
  }));
  // The example uses the first value that half of the papers reach, so it stays meaningful
  // in later snapshots.
  const example = cumulative(s.mean_distribution).find(p => p.p >= .5);
  const exampleValue = +example.v.toFixed(2);

  function drawCharts(mode) {
    const cdf = mode === "cdf", draw = cdf ? cdfChart : histChart, kind = cdf ? "Cumulative distribution" : "Histogram";
    $("viewCdf").setAttribute("aria-pressed", cdf);
    $("viewHist").setAttribute("aria-pressed", !cdf);
    $("explain").textContent = cdf
      ? `CDF stands for cumulative distribution function. A CDF curve shows the share of scores at or below each value. Find a score on the horizontal axis, and the height of the curve gives that share. For example, ${pct(example.p)} of papers have a mean rating of ${exampleValue} or lower, so the other ${pct(1 - example.p)} are above ${exampleValue}.`
      : "A histogram shows how scores are spread out. The height of each bar is the share of scores at that value, and the bars in each chart add up to 100%.";
    $("meanNote").textContent = cdf
      ? `Share of ${fmt(s.papers_with_ratings)} papers with a mean rating at or below each value.`
      : `Share of ${fmt(s.papers_with_ratings)} papers in each range. Each bar covers 1/3 of a point, centered on its label.`;
    $("ratingNote").textContent = cdf
      ? `Share of ${fmt(s.reviews)} ratings at or below each value.`
      : `Share of ${fmt(s.reviews)} ratings at each value.`;
    draw($("meanChart"), s.mean_distribution, { name: "Mean", unit: "papers", xStep: .5, thirds: true, describe: `${kind} of mean rating per paper` });
    draw($("ratingChart"), hist("rating"), { name: "Rating", unit: "ratings", xStep: 1, describe: `${kind} of individual ratings` });
    others.forEach(f => draw(hosts[f], hist(f), { w: 300, h: 190, name: cap(f), unit: "reviews", xStep: 1, describe: `${kind} of ${f} scores` }));
    $("tip").style.display = "none";
  }
  $("viewCdf").onclick = () => drawCharts("cdf");
  $("viewHist").onclick = () => drawCharts("hist");
  drawCharts("cdf");

  const tableRows = (data, digits) => {
    const pts = cumulative(data), total = pts[pts.length - 1].n;
    return pts.map(p => [p.v.toFixed(digits), fmt(p.c), pct(p.c / total), pct(p.p)]);
  };
  $("dataTables").replaceChildren(
    dataTable("Mean rating per paper", ["Value", "Papers", "Share", "At or below"], tableRows(s.mean_distribution, 2)),
    ...site.fields.map(f => dataTable(cap(f), ["Value", "Reviews", "Share", "At or below"], tableRows(hist(f), 0)))
  );

  if (site.snapshots.length > 1) {
    $("trendSection").hidden = false;
    trendChart($("trendChart"), site.snapshots);
  }
  $("foot").textContent = `Shows paper titles, numeric scores and OpenReview links only. Withdrawn (${fmt(s.withdrawn)}) and desk-rejected (${fmt(s.desk_rejected)}) submissions are excluded. Data from the OpenReview API.`;
}

function renderPapers(site, doc) {
  const hasChange = (site?.snapshots?.length ?? 0) > 1;
  const papers = doc.rows.map(([number, forum, title, ratings, conf, first]) => {
    const mean = ratings.length ? ratings.reduce((a, b) => a + b, 0) / ratings.length : null;
    return { number, forum, title, ratings, conf, mean, reviews: ratings.length,
      change: mean != null && first != null ? mean - first : null, key: title.toLowerCase() };
  });
  // Rank is fixed by mean rating, so a paper keeps its rank under search and re-sorting.
  // Tied papers share a rank.
  const rated = papers.filter(p => p.mean != null).sort((a, b) => b.mean - a.mean);
  rated.forEach((p, i) => { p.rank = i && p.mean === rated[i - 1].mean ? rated[i - 1].rank : i + 1; });
  const cols = [
    { id: "rank", name: "Rank", num: true, sort: true },
    { id: "title", name: "Title", sort: true },
    { id: "mean", name: "Mean", num: true, sort: true },
    { id: "ratings", name: "Ratings", num: true },
    { id: "reviews", name: "Reviews", num: true, sort: true },
    { id: "conf", name: "Confidence", num: true, sort: true },
  ];
  if (hasChange) cols.push({ id: "change", name: "Change", num: true, sort: true });

  let sortBy = "rank", dir = 1, terms = [], page = 0, view = [];
  const compare = (a, b) => {
    const x = a[sortBy], y = b[sortBy];
    if (x == null || y == null) return (x == null) - (y == null) || a.number - b.number;
    if (typeof x === "string") return dir * x.localeCompare(y) || a.number - b.number;
    return dir * (x - y) || a.number - b.number;
  };
  function head() {
    $("head").replaceChildren(...cols.map(c => {
      const th = document.createElement("th");
      if (c.num) th.className = "num";
      if (c.sort) {
        const b = document.createElement("button");
        b.textContent = c.name + (sortBy === c.id ? (dir < 0 ? " ↓" : " ↑") : "");
        b.onclick = () => {
          if (sortBy === c.id) dir = -dir; else { sortBy = c.id; dir = c.id === "title" || c.id === "rank" ? 1 : -1; }
          page = 0; update();
        };
        th.setAttribute("aria-sort", sortBy === c.id ? (dir < 0 ? "descending" : "ascending") : "none");
        th.appendChild(b);
      } else th.textContent = c.name;
      return th;
    }));
  }
  function body() {
    const start = page * PAGE, frag = document.createDocumentFragment();
    view.slice(start, start + PAGE).forEach((p, i) => {
      const tr = document.createElement("tr");
      const cell = (text, cls) => { const td = document.createElement("td"); if (cls) td.className = cls; td.textContent = text; tr.appendChild(td); return td; };
      cell(p.rank == null ? "–" : fmt(p.rank), "num");
      const a = document.createElement("a");
      a.href = "https://openreview.net/forum?id=" + encodeURIComponent(p.forum);
      a.target = "_blank"; a.rel = "noopener noreferrer"; a.textContent = p.title;
      cell("", "title").appendChild(a);
      cell(fix(p.mean), "num");
      cell(p.ratings.join(", ") || "–", "num");
      cell(fmt(p.reviews), "num");
      cell(fix(p.conf), "num");
      if (hasChange) cell(p.change == null ? "–" : (p.change > 0 ? "+" : "") + p.change.toFixed(2), "num");
      frag.appendChild(tr);
    });
    $("rows").replaceChildren(frag);
    const end = Math.min(start + PAGE, view.length);
    $("count").textContent = view.length ? `${fmt(start + 1)}–${fmt(end)} of ${fmt(view.length)} papers` : "No papers match";
    $("prev").disabled = page === 0;
    $("next").disabled = end >= view.length;
  }
  function update() {
    view = papers.filter(p => terms.every(t => p.key.includes(t))).sort(compare);
    head(); body();
  }
  $("search").addEventListener("input", e => { terms = e.target.value.toLowerCase().split(/\s+/).filter(Boolean); page = 0; update(); });
  $("prev").onclick = () => { page--; body(); };
  $("next").onclick = () => { page++; body(); };
  update();
}

// Always revalidate data: GitHub Pages lets browsers cache files for 10 minutes, and a
// cached file from an older build must not be paired with a newer page.
const load = name => fetch(`data/${name}.json`, { cache: "no-cache" }).then(r => {
  if (!r.ok) throw new Error(`${name}: HTTP ${r.status}`);
  return r.json();
});

// The charts and the paper list are independent, so a failure in one leaves the other working.
(async () => {
  const sitePromise = load("site"), papersPromise = load("papers");
  papersPromise.catch(() => {});
  let site = null;
  try {
    site = await sitePromise;
    renderSummary(site, site.snapshots[site.snapshots.length - 1]);
  } catch (e) {
    console.error(e);
    $("sub").textContent = "The charts could not be drawn. Please reload the page.";
  }
  try {
    renderPapers(site, await papersPromise);
  } catch (e) {
    console.error(e);
    $("count").textContent = "The paper list could not be loaded. Please reload the page.";
  }
})();
</script>
</body>
</html>
